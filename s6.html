<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Website</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #333;
            color: white;
            padding: 1rem;
            text-align: center;
        }
        nav {
            background-color: #444;
            padding: 0.5rem;
            text-align: center;
        }
        nav a {
            color: white;
            margin: 0 1rem;
            text-decoration: none;
        }
        nav a:hover {
            text-decoration: underline;
        }
        main {
            padding: 2rem;
            text-align: center;
        }
        footer {
            background-color: #333;
            color: white;
            padding: 1rem;
            text-align: center;
            position: fixed;
            bottom: 0;
            width: 100%;
        }
        img {
            max-width: 100%;
            height: auto;
        }
    </style>
</head>
<body>
    <header>
        <h1>Welcome to My Website</h1>
    </header>
    <nav>
        <a href=" https:// pwskills.com/about-us">About</a>
        <a href="#services">Services</a>
        <a href="#contact">Contact</a>
    </nav>
    <main>
        <section id="about">
            <h2>About Us</h2>
            <p>Learn more about our mission and values.</p>
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT5QKe2CqCOj8nmJhv_hsCpKd5h7KuoOxHYbg&s" alt="About Us">
        </section>
        <section id="services">
            <h2>Our Services</h2>
            <p>Discover the services we offer to help you succeed.</p>
            <img src="services-image.jpg" alt="Our Services">
        </section>
        <section id="contact">
            <h2>Contact Us</h2>
            <p>Get in touch with us for more information.</p>
            <img src="contact-image.jpg" alt="Contact Us">
        </section>
    </main>
    <footer>
        <p>&copy; 2023 My Website. All rights reserved.</p>
    </footer>
</body>
</html>
