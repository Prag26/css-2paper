<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Circle</title>
    <style>
        .circular-image {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            overflow: hidden;
        }

        .circular-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body>
    <h1>My Circular Image</h1>
    <div class="circular-image">
        <img src="https://images.pexels.com/photos/1108099/pexels-photo-1108099.jpeg" alt="Circular Image">
        
    </div>
</body>
</html>
