<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centered Div</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }
        .centered-div {
            text-align: center;
            padding: 20px;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .centered-div img {
            max-width: 50%;
            height: auto;
            border-radius: 8px;
        }
        .centered-div p {
            margin-top: 10px;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="centered-div">
        <img src="https://i.ytimg.com/vi/M0QuY0X99BM/maxresdefault.jpg" alt="Centered Image">
        <h1>Centered Div Example</h1>
        <p> COURSE NAME : FULL STASCK DEVELOPER COURSE</p>
    </div>
</body>
</html>
